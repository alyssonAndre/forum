{% load socialaccount %} {% load static %}
<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />
  </head>
  <body class="bg-gray-100 min-h-screen flex items-center justify-center">
    <div
      class="w-full max-w-6xl bg-white rounded-2xl shadow-lg overflow-hidden flex flex-col md:flex-row"
    >
      <div class="md:w-1/2 hidden md:block">
        <img
          src="{% static 'users/img/img1.webp' %}"
          alt="Imagem Login"
          class="w-full h-full object-cover"
        />
      </div>

      <div class="w-full md:w-1/2 p-10">
        <h2 class="text-3xl font-bold text-center mb-6">Bem-vindo</h2>

        {% if messages %}
        <ul class="mb-4 text-sm">
          {% for message in messages %}
          <li>{{ message }}</li>
          {% endfor %}
        </ul>
        {% endif %}

        <form method="post" class="space-y-6">
          {% csrf_token %}

          <div>
            <label
              for="id_username"
              class="block text-sm font-medium text-gray-700 mb-1"
              >Usuário</label
            >
            <input
              type="text"
              name="username"
              id="id_username"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
              required
            />
          </div>

          <div>
            <label
              for="id_password"
              class="block text-sm font-medium text-gray-700 mb-1"
              >Senha</label
            >
            <div class="relative">
              <input
                type="password"
                name="password"
                id="id_password"
                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 pr-10"
                required
              />
              <button
                type="button"
                id="togglePassword"
                class="absolute inset-y-0 right-0 px-3 flex items-center text-gray-600"
                tabindex="-1"
              >
                <i class="material-icons text-md" id="eyeIcon">visibility</i>
              </button>
            </div>
          </div>

          <button
            type="submit"
            class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition"
          >
            Entrar
          </button>
          
        </form>

          <button
          type="submit"
          class="w-full bg-blue-600 text-white py-2 mt-3 rounded-lg hover:bg-blue-700 transition"
        >
        <a href="{% url 'register' %}">Cadastre-se</a>
        </button>

        <div class="flex items-center my-6">
          <hr class="flex-grow border-gray-300" />
          <span class="mx-4 text-gray-500">ou</span>
          <hr class="flex-grow border-gray-300" />
        </div>
        <div class="flex justify-center">
          <a
            href="{% provider_login_url 'google' %}"
            class="bg-red-500 hover:bg-red-600 transition p-4 rounded-full shadow-lg"
          >
            <svg
              class="w-6 h-6 text-white"
              viewBox="0 0 533.5 544.3"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                fill="currentColor"
                d="M533.5 278.4c0-17.4-1.6-34.2-4.6-50.5H272v95.5h146.9c-6.3 33.8-25.2 62.4-53.8 81.4v67.4h86.9c51-47 81.5-116.3 81.5-193.8z"
              />
              <path
                fill="currentColor"
                d="M272 544.3c72.6 0 133.5-24.2 178-65.9l-86.9-67.4c-24.2 16.2-55 25.6-91.1 25.6-70.1 0-129.5-47.3-150.7-110.8H34.5v69.6c44.3 87.5 135.6 149.2 237.5 149.2z"
              />
              <path
                fill="currentColor"
                d="M121.3 325.8c-10.5-31.8-10.5-65.9 0-97.7V158.5H34.5c-35.5 69.5-35.5 152.3 0 221.8l86.8-67.4z"
              />
              <path
                fill="currentColor"
                d="M272 107.1c39.5 0 75.1 13.6 103.1 40.2l77.4-77.4C405.5 25.7 344.6 0 272 0 170.1 0 78.8 61.6 34.5 149.2l86.8 67.4C142.5 154.3 201.9 107.1 272 107.1z"
              />
            </svg>
          </a>
        </div>
      </div>
    </div>

    <script>
      const togglePassword = document.getElementById("togglePassword");
      const passwordField = document.getElementById("id_password");
      const eyeIcon = document.getElementById("eyeIcon");

      togglePassword.addEventListener("click", () => {
        const isPassword = passwordField.type === "password";
        passwordField.type = isPassword ? "text" : "password";
        eyeIcon.textContent = isPassword ? "visibility_off" : "visibility";
      });
    </script>
  </body>
</html>
