{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Criar Post</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="{% static 'forum/css/post_create.css' %}" />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
      rel="stylesheet"
    />
  </head>
  <body
    class="bg-gray-100 min-h-screen flex flex-col items-center px-4 sm:px-6 lg:px-8 font-sans"
  >
    <!-- Botão voltar fixo sempre no canto esquerdo superior -->
    <a
      href="{% url 'post_list' %}"
      class="fixed top-4 left-4 flex items-center text-blue-600 hover:text-blue-800 bg-white px-3 py-2 rounded-md shadow-md z-50"
      title="Voltar para o fórum"
    >
      <span class="material-symbols-outlined mr-1">arrow_back</span>
      Voltar
    </a>

    <!-- Espaço para o botão fixo não sobrepor o conteúdo -->
    <div class="w-full max-w-4xl h-12"></div>

    <!-- Título -->
    <div class="w-full max-w-4xl px-0 sm:px-6 mb-8 mt-8">
      <h2 class="text-2xl sm:text-3xl font-bold text-gray-800">
        Criar Novo Post
      </h2>
    </div>

    <!-- Formulário -->
    <div
      class="w-full max-w-md sm:max-w-xl md:max-w-3xl lg:max-w-4xl bg-white rounded-lg shadow-md p-6 sm:p-8"
    >
      <form id="createPostForm" class="space-y-6" autocomplete="off">
        <div>
          <label for="title" class="block text-gray-700 font-medium mb-1"
            >Título</label
          >
          <input
            type="text"
            id="title"
            name="title"
            required
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <div>
          <label for="content" class="block text-gray-700 font-medium mb-1"
            >Conteúdo</label
          >
          <textarea
            id="content"
            name="content"
            rows="6"
            required
            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none min-h-[150px]"
          ></textarea>
        </div>

        <div class="flex justify-end">
          <button
            id="btnCreate"
            disabled
            class="bg-blue-600 text-white font-semibold py-2 px-6 rounded hover:bg-blue-700 disabled:bg-blue-300 disabled:cursor-not-allowed flex items-center gap-2 transition"
            type="submit"
          >
            <span id="btnCreateText">Criar Post</span>
          </button>
        </div>
      </form>
    </div>

    <!-- Loader Overlay -->
    <div
      id="loaderOverlay"
      class="fixed inset-0 flex items-center justify-center z-50 bg-black/40 hidden"
    >
      <div class="loader"></div>
    </div>

    <script src="{% static 'forum/js/post_create.js' %}"></script>
  </body>
</html>
